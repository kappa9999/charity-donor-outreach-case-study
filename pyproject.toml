[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "charity-donor-outreach"
version = "1.0.0"
description = "Policy-gated reference implementation for safe, reviewable donor outreach drafts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amer Kiswani" }]
dependencies = [
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.9,<2",
  "build>=1.3,<2",
  "jsonschema>=4.25,<5",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.urls]
Repository = "https://github.com/kappa9999/charity-donor-outreach-case-study"

[project.scripts]
charity-donor-outreach = "charity_donor_outreach.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/charity_donor_outreach"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=charity_donor_outreach --cov-branch --cov-report=term-missing --cov-fail-under=95"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["charity_donor_outreach"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "@overload",
  "\\.\\.\\.",
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["charity_donor_outreach"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
